databases:
  - name: stella-db-staging
    plan: free
    databaseName: stella_ecommerce_staging
    user: stella_user

services:
  - type: web
    name: stella-api-staging
    runtime: node
    plan: free
    rootDir: server
    branch: dev
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DB_DIALECT
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: stella-db-staging
          property: host
      - key: DB_USERNAME
        fromDatabase:
          name: stella-db-staging
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stella-db-staging
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: stella-db-staging
          property: database
      - key: DATABASE_URL
        fromDatabase:
          name: stella-db-staging
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: stella-client-staging
    runtime: static
    plan: free
    rootDir: client
    branch: dev
    buildCommand: npm install && npm run build
    staticPublishPath: build
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
