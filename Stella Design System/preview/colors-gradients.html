<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stella — Background gradients</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .card { padding: 20px; gap: 12px; }
  .grad {
    height: 110px;
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: flex-end;
    color: #AEC9FF;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 11px;
    box-shadow: var(--stl-shadow-md);
  }
  .grad b {
    font-family: var(--stl-font-action);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 12px;
    margin-right: 10px;
    color: #fff;
  }
</style>
</head>
<body>
<div class="card">
  <div class="grad" style="background: linear-gradient(90deg, #3D2A54 0%, #1E1326 100%)">
    <b>Default</b>linear-gradient(90deg, #3D2A54 0%, #1E1326 100%)
  </div>
  <div class="grad" style="background: linear-gradient(90deg, #1E1326 0%, #3D2A54 100%)">
    <b>Inverse</b>linear-gradient(90deg, #1E1326 0%, #3D2A54 100%)
  </div>
</div>
</body>
</html>
