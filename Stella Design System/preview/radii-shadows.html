<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stella — Radii & shadows</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .card { padding: 24px; gap: 18px; }
  .group { display:flex; flex-direction: column; gap: 10px; }
  .lbl { font-family: var(--stl-font-action); letter-spacing:.12em; text-transform: uppercase; font-size: 11px; color: rgba(174,201,255,.55); }
  .row { display:flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  .tile {
    width: 110px; height: 70px; background: #1E1326;
    display:flex; align-items: flex-end; justify-content: center;
    padding-bottom: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 10px;
    color: rgba(174,201,255,.7);
  }
  .r-sm { border-radius: 4px; }
  .r-md { border-radius: 6px; }
  .r-lg { border-radius: 8px; }
  .r-xl { border-radius: 12px; }
  .r-full { border-radius: 999px; }
  .s-sm { box-shadow: 0 1px 2px 0 rgb(0 0 0 / .35); }
  .s-md { box-shadow: 0 4px 6px -1px rgb(0 0 0 / .35), 0 2px 4px -2px rgb(0 0 0 / .35); }
  .s-lg { box-shadow: 0 10px 15px -3px rgb(0 0 0 / .4), 0 4px 6px -4px rgb(0 0 0 / .4); }
  .s-xl { box-shadow: 0 20px 25px -5px rgb(0 0 0 / .45), 0 8px 10px -6px rgb(0 0 0 / .45); }
</style>
</head>
<body>
<div class="card">
  <div class="group">
    <span class="lbl">Radius</span>
    <div class="row">
      <div class="tile r-sm">sm · 4</div>
      <div class="tile r-md">md · 6</div>
      <div class="tile r-lg">lg · 8</div>
      <div class="tile r-xl">xl · 12</div>
      <div class="tile r-full">full</div>
    </div>
  </div>
  <div class="group">
    <span class="lbl">Shadows</span>
    <div class="row">
      <div class="tile s-sm r-md">sm</div>
      <div class="tile s-md r-md">md</div>
      <div class="tile s-lg r-md">lg · cards</div>
      <div class="tile s-xl r-md">xl · hover</div>
    </div>
  </div>
</div>
</body>
</html>
