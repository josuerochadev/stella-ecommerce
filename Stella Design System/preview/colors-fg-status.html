<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stella — Foreground & status</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .card { padding: 20px; gap: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    padding: 8px 14px;
    border-radius: 999px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .fg-row { display: flex; flex-direction: column; gap: 8px; padding: 14px; background: #1E1326; border-radius: 10px; }
  .line { display: flex; gap: 10px; align-items: baseline; }
  .line .what { font-family: var(--stl-font-action); letter-spacing: 0.08em; text-transform: uppercase; font-size: 11px; min-width: 90px; }
</style>
</head>
<body>
<div class="card">
  <div class="fg-row">
    <div class="line"><span class="what" style="color:#AEC9FF">Default</span><span style="color:#AEC9FF;font-family:'Roboto Slab',serif">Aa — Soft periwinkle starlight</span></div>
    <div class="line"><span class="what" style="color:#fff">Hover</span><span style="color:#fff;font-family:'Roboto Slab',serif">Aa — pure white</span></div>
    <div class="line"><span class="what" style="color:rgba(174,201,255,.7)">Muted</span><span style="color:rgba(174,201,255,.7);font-family:'Roboto Slab',serif">Aa — text/70 hint</span></div>
    <div class="line"><span class="what" style="color:#3D2A54">On amber</span><span style="background:#FFB347;color:#3D2A54;padding:2px 8px;border-radius:4px;font-family:'Roboto Slab',serif">Aa — purple on CTA</span></div>
  </div>

  <div class="row">
    <span class="chip" style="background:rgba(22,163,74,.18);color:#86efac"><span class="dot" style="background:#16a34a"></span>success #16a34a</span>
    <span class="chip" style="background:rgba(220,38,38,.18);color:#fca5a5"><span class="dot" style="background:#dc2626"></span>danger #dc2626</span>
    <span class="chip" style="background:rgba(245,158,11,.18);color:#fcd34d"><span class="dot" style="background:#f59e0b"></span>warning #f59e0b</span>
    <span class="chip" style="background:rgba(59,130,246,.18);color:#93c5fd"><span class="dot" style="background:#3b82f6"></span>info #3b82f6</span>
  </div>
</div>
</body>
</html>
