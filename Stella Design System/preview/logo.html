<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Stella — Logo v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="_base.css"/>
<style>
.card { padding: 0; min-height: 340px; justify-content: center; align-items: center; }
.grid { display:grid; grid-template-columns: 1fr 1fr; gap: 0; width: 100%; height: 340px; }
.cell {
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  padding: 24px;
}
.dark-cell { background: linear-gradient(135deg,#1E1326 0%,#3D2A54 100%); }
.light-cell { background: linear-gradient(135deg,#f0ecfd 0%,#eef4ff 100%); }
.lbl { font-family:'Bebas Neue',sans-serif; letter-spacing:.12em; font-size:10px; text-transform:uppercase; opacity:.45; }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="cell dark-cell">
      <span class="lbl" style="color:#AEC9FF">Wordmark — fond sombre</span>
      <img src="../assets/logo/wordmark.svg" style="width:280px; height:auto"/>
    </div>
    <div class="cell light-cell">
      <span class="lbl" style="color:rgba(42,26,62,.5)">Wordmark — fond clair</span>
      <img src="../assets/logo/wordmark.svg" style="width:280px; height:auto; filter:hue-rotate(0deg)"/>
    </div>
    <div class="cell dark-cell" style="flex-direction:row; gap:28px; justify-content:center">
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <span class="lbl" style="color:#AEC9FF">Monogramme 80</span>
        <img src="../assets/logo/monogram.svg" style="width:80px;height:80px"/>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <span class="lbl" style="color:#AEC9FF">Monogramme 40</span>
        <img src="../assets/logo/monogram.svg" style="width:40px;height:40px"/>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <span class="lbl" style="color:#AEC9FF">Compact</span>
        <img src="../assets/logo/wordmark-compact.svg" style="height:40px;width:auto"/>
      </div>
    </div>
    <div class="cell light-cell">
      <span class="lbl" style="color:rgba(42,26,62,.45)">Usage minimal / favicon</span>
      <img src="../assets/logo/monogram.svg" style="width:64px;height:64px"/>
    </div>
  </div>
</div>
</body>
</html>
