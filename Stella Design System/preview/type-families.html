<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stella — Type families</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .card { padding: 24px; gap: 18px; }
  .row { display: grid; grid-template-columns: 90px 1fr; align-items: baseline; gap: 16px; }
  .row .label { color: rgba(174,201,255,.6); }
  .row .specimen { color: #AEC9FF; }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <span class="label">Display</span>
    <span class="specimen" style="font-family:'Dela Gothic One',serif;font-size:38px;line-height:1;">Stella</span>
  </div>
  <div class="row">
    <span class="label">Serif</span>
    <span class="specimen" style="font-family:'Roboto Slab',serif;font-size:24px;">Adoptez une étoile.</span>
  </div>
  <div class="row">
    <span class="label">Sans</span>
    <span class="specimen" style="font-family:'Roboto',sans-serif;font-size:18px;">Parcourir les constellations et trouver la bonne étoile.</span>
  </div>
  <div class="row">
    <span class="label">Action</span>
    <span class="specimen" style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.06em;">VOIR NOTRE CATALOGUE</span>
  </div>
</div>
</body>
</html>
