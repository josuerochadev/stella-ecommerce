<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stella — Iconography</title>
<link rel="stylesheet" href="_base.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  .card { padding: 24px; gap: 20px; }
  .grid { display:grid; grid-template-columns: repeat(7, 1fr); gap: 10px; text-align:center; }
  .icon-box {
    display:flex; flex-direction: column; align-items:center; gap: 6px;
    padding: 12px 6px; border-radius: 6px; background:#1E1326;
  }
  .icon-box i { font-size: 22px; color: #AEC9FF; }
  .icon-box span { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; color: rgba(174,201,255,.7); }
  .lbl { font-family: var(--stl-font-action); letter-spacing:.12em; text-transform: uppercase; font-size: 11px; color: rgba(174,201,255,.55); }
</style>
</head>
<body>
<div class="card">
  <div class="lbl">Font Awesome 6 (solid) — react-icons/fa in code</div>
  <div class="grid">
    <div class="icon-box"><i class="fas fa-house"></i><span>FaHome</span></div>
    <div class="icon-box"><i class="fas fa-magnifying-glass"></i><span>FaSearch</span></div>
    <div class="icon-box"><i class="fas fa-store"></i><span>FaStore</span></div>
    <div class="icon-box"><i class="fas fa-user"></i><span>FaUser</span></div>
    <div class="icon-box"><i class="fas fa-cart-shopping"></i><span>FaShoppingCart</span></div>
    <div class="icon-box"><i class="fas fa-heart"></i><span>FaHeart</span></div>
    <div class="icon-box"><i class="fas fa-eye"></i><span>FaEye</span></div>
    <div class="icon-box"><i class="fas fa-bars"></i><span>FaBars</span></div>
    <div class="icon-box"><i class="fas fa-xmark"></i><span>FaTimes</span></div>
    <div class="icon-box"><i class="fas fa-arrow-left"></i><span>FaArrowLeft</span></div>
    <div class="icon-box"><i class="fas fa-arrow-up"></i><span>FaArrowUp</span></div>
    <div class="icon-box"><i class="fas fa-arrow-down"></i><span>FaArrowDown</span></div>
    <div class="icon-box"><i class="fas fa-trash"></i><span>FaTrash</span></div>
    <div class="icon-box"><i class="fas fa-spinner"></i><span>spinner</span></div>
  </div>
</div>
</body>
</html>
