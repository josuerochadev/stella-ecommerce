<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8DEFF"></stop>
      <stop offset="100%" stop-color="#C4DAFF"></stop>
    </linearGradient>
    <filter id="fg" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="fg2" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="1" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <linearGradient id="sv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8DEFF" stop-opacity="0"></stop>
      <stop offset="45%" stop-color="#E8DEFF" stop-opacity="0.85"></stop>
      <stop offset="55%" stop-color="#E8DEFF" stop-opacity="0.85"></stop>
      <stop offset="100%" stop-color="#E8DEFF" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8DEFF" stop-opacity="0"></stop>
      <stop offset="45%" stop-color="#E8DEFF" stop-opacity="0.85"></stop>
      <stop offset="55%" stop-color="#E8DEFF" stop-opacity="0.85"></stop>
      <stop offset="100%" stop-color="#E8DEFF" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  
  <line x1="8" y1="12" x2="48" y2="52" stroke="#E8DEFF" stroke-width="0.45" opacity="0.28" filter="url(#fg2)"></line>
  <line x1="48" y1="12" x2="8" y2="52" stroke="#E8DEFF" stroke-width="0.45" opacity="0.28" filter="url(#fg2)"></line>
  <line x1="28" y1="4" x2="28" y2="60" stroke="url(#sv)" stroke-width="0.8" filter="url(#fg2)"></line>
  <line x1="4" y1="32" x2="52" y2="32" stroke="url(#sh)" stroke-width="0.8" filter="url(#fg2)"></line>

  
  <circle cx="28" cy="32" r="6" fill="#FFB347" opacity="0.12" filter="url(#fg)"></circle>
  <circle cx="28" cy="32" r="2.2" fill="#FFB347" opacity="0.9" filter="url(#fg2)"></circle>
  <circle cx="28" cy="32" r="0.9" fill="white" opacity="0.95"></circle>

  
  <text x="60" y="46" font-family="&#39;Dela Gothic One&#39;, serif" font-size="38" fill="url(#w)" letter-spacing="-1">Stella</text>
</svg>