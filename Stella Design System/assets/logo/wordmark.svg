<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8DEFF"></stop>
      <stop offset="100%" stop-color="#C4DAFF"></stop>
    </linearGradient>
    
    <filter id="spike-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.5" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    
    <filter id="core-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    
    <linearGradient id="spike-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8DEFF" stop-opacity="0"></stop>
      <stop offset="42%" stop-color="#E8DEFF" stop-opacity="0.85"></stop>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"></stop>
      <stop offset="58%" stop-color="#E8DEFF" stop-opacity="0.85"></stop>
      <stop offset="100%" stop-color="#E8DEFF" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="spike-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8DEFF" stop-opacity="0"></stop>
      <stop offset="42%" stop-color="#E8DEFF" stop-opacity="0.85"></stop>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"></stop>
      <stop offset="58%" stop-color="#E8DEFF" stop-opacity="0.85"></stop>
      <stop offset="100%" stop-color="#E8DEFF" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="spike-d1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8DEFF" stop-opacity="0"></stop>
      <stop offset="45%" stop-color="#E8DEFF" stop-opacity="0.45"></stop>
      <stop offset="55%" stop-color="#E8DEFF" stop-opacity="0.45"></stop>
      <stop offset="100%" stop-color="#E8DEFF" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="spike-d2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8DEFF" stop-opacity="0"></stop>
      <stop offset="45%" stop-color="#E8DEFF" stop-opacity="0.45"></stop>
      <stop offset="55%" stop-color="#E8DEFF" stop-opacity="0.45"></stop>
      <stop offset="100%" stop-color="#E8DEFF" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  

  
  <line x1="16" y1="19" x2="68" y2="71" stroke="url(#spike-d1)" stroke-width="0.7" filter="url(#spike-glow)"></line>
  <line x1="68" y1="19" x2="16" y2="71" stroke="url(#spike-d2)" stroke-width="0.7" filter="url(#spike-glow)"></line>

  
  <line x1="42" y1="4" x2="42" y2="86" stroke="url(#spike-v)" stroke-width="0.9" filter="url(#spike-glow)"></line>

  
  <line x1="2" y1="45" x2="82" y2="45" stroke="url(#spike-h)" stroke-width="0.9" filter="url(#spike-glow)"></line>

  
  <circle cx="42" cy="45" r="12" fill="#FFB347" opacity="0.06" filter="url(#core-glow)"></circle>

  
  <circle cx="42" cy="45" r="5" fill="#FFB347" opacity="0.25" filter="url(#core-glow)"></circle>

  
  <circle cx="42" cy="45" r="2.2" fill="#FFB347" opacity="0.95" filter="url(#spike-glow)"></circle>

  
  <circle cx="42" cy="45" r="0.9" fill="white" opacity="0.95"></circle>

  
  <text x="100" y="62" font-family="&#39;Dela Gothic One&#39;, serif" font-size="50" fill="url(#word)" letter-spacing="-1.5">Stella</text>
</svg>