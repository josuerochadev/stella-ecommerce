<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#130a24"></stop>
      <stop offset="100%" stop-color="#080610"></stop>
    </linearGradient>
    <filter id="sg" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="sg2" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="1.2" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <linearGradient id="sv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8DEFF" stop-opacity="0"></stop>
      <stop offset="45%" stop-color="#E8DEFF" stop-opacity="0.8"></stop>
      <stop offset="55%" stop-color="#E8DEFF" stop-opacity="0.8"></stop>
      <stop offset="100%" stop-color="#E8DEFF" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8DEFF" stop-opacity="0"></stop>
      <stop offset="45%" stop-color="#E8DEFF" stop-opacity="0.8"></stop>
      <stop offset="55%" stop-color="#E8DEFF" stop-opacity="0.8"></stop>
      <stop offset="100%" stop-color="#E8DEFF" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#bg)"></rect>

  
  <line x1="10" y1="10" x2="54" y2="54" stroke="#E8DEFF" stroke-width="0.5" opacity="0.3" filter="url(#sg2)"></line>
  <line x1="54" y1="10" x2="10" y2="54" stroke="#E8DEFF" stroke-width="0.5" opacity="0.3" filter="url(#sg2)"></line>

  
  <line x1="32" y1="4" x2="32" y2="60" stroke="url(#sv)" stroke-width="0.8" filter="url(#sg2)"></line>
  <line x1="4" y1="32" x2="60" y2="32" stroke="url(#sh)" stroke-width="0.8" filter="url(#sg2)"></line>

  
  <circle cx="32" cy="32" r="8" fill="#FFB347" opacity="0.12" filter="url(#sg)"></circle>
  <circle cx="32" cy="32" r="3" fill="#FFB347" opacity="0.5" filter="url(#sg2)"></circle>
  <circle cx="32" cy="32" r="1.4" fill="white" opacity="0.95"></circle>
</svg>