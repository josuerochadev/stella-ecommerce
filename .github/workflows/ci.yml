name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_call:

jobs:
  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint-and-test-client:
    name: Client - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --coverage

  lint-and-test-server:
    name: Server - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  typecheck:
    name: Client - TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [lint-and-test-client, lint-and-test-server, typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stella_user
          POSTGRES_PASSWORD: stella
          POSTGRES_DB: stella_ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stella_user -d stella_ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - name: Build client for E2E
        run: npm run build
        working-directory: client
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:3000/api
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Init database
        run: npm run create-tables && npm run generate-data
        working-directory: server
        env:
          NODE_ENV: development
          DB_USERNAME: stella_user
          DB_PASSWORD: stella
          DB_DATABASE: stella_ecommerce
          DB_HOST: localhost
          DB_DIALECT: postgres
          JWT_SECRET: ci_test_jwt_secret_key_for_e2e
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: development
          DB_USERNAME: stella_user
          DB_PASSWORD: stella
          DB_DATABASE: stella_ecommerce
          DB_HOST: localhost
          DB_DIALECT: postgres
          JWT_SECRET: ci_test_jwt_secret_key_for_e2e
          REACT_APP_API_URL: http://localhost:3000/api
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit client dependencies
        run: npm audit --audit-level=high --omit=dev
        working-directory: client
        continue-on-error: true
      - name: Audit server dependencies
        run: npm audit --audit-level=high --omit=dev
        working-directory: server
        continue-on-error: true
